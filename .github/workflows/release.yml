name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Idemora v__VERSION__'
          releaseBody: |
            ## What's new in v2.0.3

            **AI actions**
            - Requesting multiple changes at once (e.g. "create 3 notes for this project") now shows a single review window with a list of proposed changes and a preview, instead of separate cards stacked one after another
            - Calendar events created from a note's chat no longer default to the wrong category — generic or test events now default to "personal" instead of "note"
            - Write confirmation cards now show real, readable content instead of raw IDs: creating a note under a parent shows the actual destination, updating a goal or calendar event shows its actual title, and deleting a note section or calendar event shows what's actually being removed
            - Added a safeguard that flags it in chat if the AI claims a change was made but no confirmation card actually appeared, so you're never left thinking something happened when it didn't
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}