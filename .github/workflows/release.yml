name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Idemora v__VERSION__'
          releaseBody: |
            ## What's new in v1.5.0

            **Redesigned UI**
            - Fully restructured and upgraded interface — cleaner layout, refined typography, and a more cohesive visual language throughout

            **Canvas**
            - Freeform canvas notes — create nodes, connect them, pan and zoom freely
            - Full editing power inside canvas nodes — slash commands, note links, sub-pages
            - Export your canvas as PNG, SVG, Markdown, or JSON

            **Bookmarks**
            - Pin any note to your bookmarks panel for quick access
            - Organise bookmarks into named groups and reorder them freely

            **Backup System**
            - Export your vault as an AES-256-GCM encrypted .nkbackup file
            - Schedule automatic backups daily, weekly, or on every change
            - Point your backup folder at iCloud Drive, Dropbox, or Google Drive for automatic cloud sync

            **Performance**
            - Cold start cut from 7–8s to under 2s — notes load metadata first, content on demand
            - Canvas engine now only redraws when something actually changes

            **Bug fixes**
            - Graph node editor now correctly loads note content when opened with E
            - Triple-clicking a graph node opens it in the main editor as expected
            - Canvas node drag no longer jumps on pointer-down
            - Canvas textarea overlay stays pixel-aligned after panning
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}