name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Idemora v__VERSION__'
          releaseBody: |
            ## What's new in v2.1.3

            **Infrastructure**
            - Release builds now also publish under stable, version-independent filenames, so the marketing site can link directly to the latest installer without pointing at GitHub
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload stable-named download alias
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            SRC=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
            DEST="Idemora-Setup.exe"
          elif [ "${{ matrix.args }}" = "--target aarch64-apple-darwin" ]; then
            SRC=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
            DEST="Idemora-Mac-AppleSilicon.dmg"
          else
            SRC=$(ls src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
            DEST="Idemora-Mac-Intel.dmg"
          fi
          echo "Matched source file: $SRC"
          cp "$SRC" "$DEST"
          gh release upload "${{ github.ref_name }}" "$DEST" --clobber