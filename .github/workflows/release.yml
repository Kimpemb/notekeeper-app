name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Idemora v__VERSION__'
          releaseBody: |
            ## What's new in v1.4.0

            **Backup System (Tier 3)**
            - Export your entire vault as an AES-256-GCM encrypted .nkbackup file
            - Restore from any .nkbackup file with full note, backlink, and settings recovery
            - Wrong password and corrupted file detection with clean error messages
            - Backups are gzip compressed before encryption — 84% smaller than uncompressed (5.5MB → 907KB on real vaults)
            - Backups are signed to Idemora — cannot be restored in any other app

            **Auto-Backup**
            - Schedule automatic backups on app launch — daily, weekly, or on change only
            - Change detection via SHA-256 bundle hash — no unnecessary backups if nothing changed
            - Point your backup folder at iCloud Drive, Dropbox, or Google Drive for automatic cloud sync
            - Last backup timestamp displayed in settings
            - Silent failure on launch — auto-backup never blocks or crashes the app
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}