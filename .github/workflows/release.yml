name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Idemora v__VERSION__'
          releaseBody: |
            ## What's new in v2.0.0

            **AI Action Layer**
            - The AI can now directly create, edit, move, and restructure notes, not just chat about them
            - New write tools: create notes, insert or replace content, delete blocks, update calendar events, update goals, move notes
            - Confirmation step before any AI write is applied, so nothing changes without your approval

            **Calendar**
            - Full calendar with day, week, month, and agenda views
            - Recurring events with a redesigned edit/delete flow
            - Notes and calendar events stay in sync automatically

            **Goals**
            - Track goals with milestones and progress computed automatically from your notes
            - Daily streaks and a score widget showing your progress over day, week, or month

            **Smarter search and memory**
            - Hybrid search combining keyword and semantic matching for better results
            - The AI now remembers relevant context across your notes more reliably
            - Web search results are used more intelligently for general knowledge questions

            **Document import/export**
            - Export notes to Word (.docx), including tables and images
            - Import multiple files at once (PDF, DOCX, PPTX, JSON, Markdown)

            **Bug fixes and stability**
            - Fixed several issues where the AI could act on stale or outdated note content
            - More reliable error recovery when the AI's edits conflict with note structure
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}