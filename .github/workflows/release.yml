name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Idemora v__VERSION__'
          releaseBody: |
            ## What's new in v2.1.4

            **Fixes**
            - Fixed follow-up messages being misclassified as standalone queries, causing wrong or unrelated answers to short replies
            - Fixed AI responses occasionally mixing in unrelated content from past chat sessions
            - Fixed a bug where clearing a session could leave stale state visible if the underlying delete failed
            - Fixed duplicate/overlapping answers appearing for the same question
            - Fixed redundant network calls that were adding unnecessary delay to responses
            - Improved request timeout handling so slower requests fail more predictably
            - Improved reliability of the thought-graph decomposition pipeline

            **New**
            - Added a manual trigger to force thought-graph extraction on a specific message
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload stable-named download alias
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            SRC=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
            DEST="Idemora-Setup.exe"
          elif [ "${{ matrix.args }}" = "--target aarch64-apple-darwin" ]; then
            SRC=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
            DEST="Idemora-Mac-AppleSilicon.dmg"
          else
            SRC=$(ls src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
            DEST="Idemora-Mac-Intel.dmg"
          fi
          echo "Matched source file: $SRC"
          cp "$SRC" "$DEST"
          gh release upload "${{ github.ref_name }}" "$DEST" --clobber