name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Check Supabase secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "VITE_SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "VITE_SUPABASE_ANON_KEY is missing"; exit 1; }

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Idemora v__VERSION__'
          releaseBody: |
            ## What's new in v2.2.4

            **New**
            - An optional "forgotten notes" banner that reminds you of notes you haven't opened in a while. It replaces the related-notes banner
            - Closing every tab now leaves a blank note: type a title and press Enter to create it
            - Notepads: plain-text notes that stay on this device only (Ctrl+Alt+N). Ctrl+N creates a root note and Ctrl+Shift+N a sub-note, each in a new tab
            - Back and forward buttons in every note view, including notepads. Each tab keeps its own history, and it is kept after a restart
            - Find and replace in notepads (Ctrl+F, Ctrl+H), plus whole word and regex options, with Replace moving on to the next match

            **Improved**
            - The backlinks panel opens much faster: linked notes show straight away and unlinked mentions load in the background
            - Selecting and trashing many notes at once is faster, and right-click Trash acts on the whole selection
            - Switching sidebar panels, clicking notes in the sidebar and opening the Move block dialog all feel lighter
            - The breadcrumb shows sibling notes in hover menus and fits narrow panes
            - Split view: shortcuts act on the active pane, and chat, backlinks and outline share one panel on the right edge
            - Cleaner sidebar: neutral highlights, slimmer rows and a narrower panel
            - The find bar keeps its close button on the first row when several panels are open

            **Fixed**
            - Switching AI provider in the chat panel now takes effect immediately
            - The maximize button now shows the right icon for the window's real state
            - The tab bar no longer wobbles up and down when you shake the pointer over it
            - The note selection is cleared when the active pane has no open note

            **In v2.2.3**
            - The note graph and thought graph now follow light and dark mode, including the toolbar, search box, side panels, chat panel and minimap

            **In v2.2.2**
            - Long note titles no longer run past the edge of the Settings window
            - Pressing Ctrl+A outside a text area no longer selects the whole page
            - A brief connection hiccup no longer shows "Could not reach the server" in the review list

            **In v2.2.1**
            - Sign-in now works in the installed app (v2.2.0 reported that sync was not configured)

            **New in v2.2.0**
            - Sync (beta): sign in to keep your notes in an online vault and download that vault on a second device
            - Two-way sync: edits made on another device are pulled in, and deletes, trash and restores carry over
            - Needs review: when a note changed on both devices, review it block by block, or choose between your version and the other one. A backup is saved before anything is replaced
            - A badge in the app shows how many notes need review

            **Improved**
            - Faster comparison of large notes
            - Plainer wording in the sign-in and vault prompts
            - Sync now repairs its own change tracking before each run

            **Known issues**
            - Sync can be slow or time out for a while when the online vault is slow to respond. It recovers on the next run
            - A note's sub-pages may occasionally show fewer items until the note is reopened
            - Attachments, images, settings, pins and bookmarks do not sync yet
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload stable-named download alias
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            SRC=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
            DEST="Idemora-Setup.exe"
          elif [ "${{ matrix.args }}" = "--target aarch64-apple-darwin" ]; then
            SRC=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
            DEST="Idemora-Mac-AppleSilicon.dmg"
          else
            SRC=$(ls src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
            DEST="Idemora-Mac-Intel.dmg"
          fi
          echo "Matched source file: $SRC"
          cp "$SRC" "$DEST"
          gh release upload "${{ github.ref_name }}" "$DEST" --clobber